name: Garimpo Shopee Diário

on:

  workflow_dispatch:

  schedule:

    - cron: "0 11 * * *"

permissions:

  contents: write

jobs:

  garimpo:

    runs-on: ubuntu-latest

    steps:

      - name: Baixar projeto

        uses: actions/checkout@v4

      - name: Preparar Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.12"

      - name: Executar busca

        env:

          SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}

          SHOPEE_SECRET: ${{ secrets.SHOPEE_SECRET }}

        run: python buscar_produtos.py

      - name: Salvar relatório

        run: |

          git config user.name "Garimpo Shopee"

          git config user.email "actions@github.com"

          git add data/produtos.json

          git diff --cached --quiet || git commit -m "Atualizar garimpo diário"

          git push
